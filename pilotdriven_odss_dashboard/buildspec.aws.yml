version: 0.2
env:
  shell: bash

phases:
  pre_build:
    commands:
      - |
        case "${IMAGE_TAG:-}" in
          ""|[.-]*|*[!A-Za-z0-9_.-]*)
            echo "IMAGE_TAG is required and must be a valid immutable Docker tag." >&2
            exit 2
            ;;
        esac
        if [ "${#IMAGE_TAG}" -gt 128 ]; then
          echo "IMAGE_TAG exceeds Docker's 128-character tag limit." >&2
          exit 2
        fi
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REPOSITORY_URI"
  build:
    commands:
      - |
        set -euo pipefail
        fixture_bundle=.private-build-inputs/saved-analysis-v74.tar
        chmod 0444 "$fixture_bundle"
        fixture_sha256=$(sha256sum "$fixture_bundle" | awk '{print $1}')
        docker build --pull --platform linux/amd64 \
          --build-arg OCR_BUILD_JOBS=4 \
          --build-context saved_analyses=.private-build-inputs \
          --build-arg "SAVED_ANALYSIS_BUNDLE_SHA256=$fixture_sha256" \
          -t "$ECR_REPOSITORY_URI:$IMAGE_TAG" .
      - docker run --rm --platform linux/amd64 --network none --entrypoint sh "$ECR_REPOSITORY_URI:$IMAGE_TAG" -c 'test ! -e /run/private-test-inputs/saved-analysis-v74.tar && test ! -e /app/.private-build-inputs'
      - docker run --rm --platform linux/amd64 --entrypoint python "$ECR_REPOSITORY_URI:$IMAGE_TAG" tests/check_webgl_runtime.py
      - docker run --rm --platform linux/amd64 --network none --entrypoint python "$ECR_REPOSITORY_URI:$IMAGE_TAG" tests/check_ocr_runtime.py
      - python3 ocr/scan_image.py "$ECR_REPOSITORY_URI:$IMAGE_TAG"
  post_build:
    commands:
      - test "$CODEBUILD_BUILD_SUCCEEDING" = 1
      - docker push "$ECR_REPOSITORY_URI:$IMAGE_TAG"
